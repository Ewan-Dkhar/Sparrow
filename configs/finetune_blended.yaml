# Sparrow MoE Domain Adaptation Configuration: Wikipedia + Python Code + Replay
# Continued Pre-training from best_sparrow_model.pt on NVIDIA GeForce RTX 4060 (8GB VRAM)

model:
  name: "sparrow-moe-150m"
  vocab_size: 50257
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  head_dim: 64
  d_ff: 1024
  n_experts: 8
  top_k: 2
  max_seq_len: 2048
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  router_noise_mult: 1.0
  aux_loss_coef: 0.01
  tie_word_embeddings: true

hardware:
  device: "cuda"
  precision: "bfloat16"
  use_flash_attn: true
  compile: false

training:
  batch_size: 4
  seq_len: 1024
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4          # Lower learning rate to preserve existing story representations
  min_learning_rate: 1.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 200              # Gentle warmup for optimizer momentum
  max_steps: 15000
  eval_interval: 250
  eval_steps: 25
  val_file: "data/blended_val.bin"
  save_interval: 1000
  checkpoint_dir: "checkpoints"
  checkpoint_name: "sparrow_blended.pt"

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.3

cli:
  system_prompt: "You are Sparrow, an educational and coding MoE assistant running locally on an RTX 4060."
  theme: "monokai"
  stream_speed: 0.01
